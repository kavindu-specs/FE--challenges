<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="main.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

</head>
<body>
  <div class ="main-container">
    <div id ="profile-flex-container">
      <div id="image-wrapper">
        <img src="./assets/images/avatar-jessica.jpeg" alt="" width:50%,height:50%>
      </div>
      <div id = "personal-data-wrapper">
        <div id ="name">Jessica Randall</div>
        <div id = "address"> London, United Kingdom</div>
      </div>
      <div id ="content"> "Front-end developer and avid reader."</div>
    </div>
    <div id ="social-flex-container">
      <div>GitHub</div>
      <div>Frontend Mentor</div>
      <div>LinkedIn</div>
      <div>Twitter</div>
      <div>Instagram</div>
    </div>
  </div>
    
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Kavindu Prabodya</a>.
    </div>

</body>
</html>
